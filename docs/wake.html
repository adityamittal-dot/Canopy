<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canopy - waking up</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0e1210;
    color: #e7ece9;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .card { max-width: 420px; }
  .spinner {
    width: 36px;
    height: 36px;
    margin: 0 auto 20px;
    border-radius: 50%;
    border: 3px solid rgba(231, 236, 233, 0.2);
    border-top-color: #4caf7d;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 8px; }
  p { font-size: 0.9rem; line-height: 1.5; color: #9aa39d; margin: 0; }
  .retry { margin-top: 18px; font-size: 0.8rem; color: #6b746e; }
</style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Waking up Canopy&hellip;</h1>
    <p>The server is starting from idle - this usually takes 30-60 seconds. Hang tight, you'll be redirected automatically.</p>
    <p class="retry" id="status"></p>
  </div>

<script>
  // Free-tier hosts (Render, etc.) spin the server down after inactivity.
  // This page loads instantly from GitHub Pages, polls the app's cheap
  // /healthz/ endpoint until it responds, then sends the visitor on to
  // the real app - so the visible wait is a message instead of a stalled
  // tab or a 502.
  var APP_URL = 'https://canopy-v7hb.onrender.com/';
  var HEALTH_URL = 'https://canopy-v7hb.onrender.com/healthz/';
  var statusEl = document.getElementById('status');
  var attempt = 0;

  function poll() {
    attempt += 1;
    if (attempt > 1) {
      statusEl.textContent = 'Still starting up (attempt ' + attempt + ')…';
    }
    fetch(HEALTH_URL, { cache: 'no-store', mode: 'cors' })
      .then(function (res) {
        if (res.ok) {
          window.location.replace(APP_URL);
        } else {
          scheduleNext();
        }
      })
      .catch(scheduleNext);
  }

  function scheduleNext() {
    // Fixed 2s cadence - a cold Render boot is ~30-60s total, so this
    // trades a bit of extra polling for a simple, predictable wait.
    setTimeout(poll, 2000);
  }

  poll();
</script>
</body>
</html>
